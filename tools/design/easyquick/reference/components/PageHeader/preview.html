<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>PageHeader</title></head>
<body class="p-6">
<div class="page-header flex items-start justify-between gap-4">
  <div>
    <h1 class="page-title">订单管理</h1>
    <p class="page-description">共 196 笔订单，最近同步于 10 分钟前</p>
  </div>
  <div class="flex items-center gap-3">
    <button type="button" class="btn btn-secondary"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>导出</button>

</div>

  <div class="tabs w-fit"><button type="button" class="tab tab-active">全部</button><button type="button" class="tab">待发货</button><button type="button" class="tab">已发货</button></div>
</div>
</body>
</html>
