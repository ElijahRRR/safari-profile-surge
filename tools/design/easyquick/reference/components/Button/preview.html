<!-- @dsCard group="基础控件" height=168 width=880 subtitle="btn · btn-primary / secondary / ghost / danger / success / warning" -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Button</title></head>
<body class="p-6">
<div class="space-y-5">
  <div class="flex flex-wrap items-center gap-3">
    <button type="button" class="btn btn-primary"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>新建订单</button>
    <button type="button" class="btn btn-secondary"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>导出</button>
    <button type="button" class="btn btn-ghost">取消</button>
    <button type="button" class="btn btn-danger"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>删除</button>
    <button type="button" class="btn btn-success">通过审核</button>
    <button type="button" class="btn btn-warning">暂停同步</button>
  </div>
  <div class="flex flex-wrap items-center gap-3">
    <button type="button" class="btn btn-primary btn-sm">小号</button>
    <button type="button" class="btn btn-primary btn-md">中号</button>
    <button type="button" class="btn btn-primary">默认</button>
    <button type="button" class="btn btn-primary btn-lg">大号</button>
    <button type="button" class="btn btn-secondary btn-icon" aria-label="刷新"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg></button>
    <button type="button" class="btn btn-ghost btn-icon" aria-label="更多"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM12.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM18.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/></svg></button>
    <button type="button" class="btn btn-primary" disabled>已禁用</button>
  </div>
</div>
</body>
</html>
