<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Pagination</title></head>
<body class="p-6">
<div class="overflow-hidden rounded-xl border border-gray-200 dark:border-dark-700">
  <div class="flex items-center justify-between border-t border-gray-200 bg-white px-4 py-3 dark:border-dark-700 dark:bg-dark-800 sm:px-6">
    <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
      <div class="flex items-center space-x-4">
        <p class="text-sm text-gray-700 dark:text-gray-300">显示 <span class="font-medium">1</span> 至 <span class="font-medium">20</span> 条，共 <span class="font-medium">196</span> 条</p>
        <div class="flex items-center space-x-2">
          <span class="text-sm text-gray-700 dark:text-gray-300">每页:</span>
          <div class="w-20">
            <button type="button" class="select-trigger"><span class="select-value">20</span><span class="select-icon"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg></span></button>
          </div>
        </div>
      </div>
      <nav class="relative z-0 inline-flex -space-x-px rounded-md shadow-sm" aria-label="Pagination">
        <button type="button" disabled class="relative inline-flex items-center rounded-l-md border border-gray-300 bg-white px-2 py-2 text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50 dark:border-dark-600 dark:bg-dark-700 dark:text-gray-400 dark:hover:bg-dark-600" aria-label="上一页"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button>
        <button type="button" aria-current="page" class="relative inline-flex items-center border px-4 py-2 text-sm font-medium z-10 border-primary-500 bg-primary-50 text-primary-600 dark:bg-primary-900/30 dark:text-primary-400">1</button>
        <button type="button" class="relative inline-flex items-center border px-4 py-2 text-sm font-medium border-gray-300 bg-white text-gray-700 hover:bg-gray-50 dark:border-dark-600 dark:bg-dark-700 dark:text-gray-300 dark:hover:bg-dark-600">2</button>
        <button type="button" class="relative inline-flex items-center border px-4 py-2 text-sm font-medium border-gray-300 bg-white text-gray-700 hover:bg-gray-50 dark:border-dark-600 dark:bg-dark-700 dark:text-gray-300 dark:hover:bg-dark-600">3</button>
        <button type="button" disabled class="relative inline-flex items-center border px-4 py-2 text-sm font-medium border-gray-300 bg-white text-gray-700 dark:border-dark-600 dark:bg-dark-700 dark:text-gray-300 cursor-default">…</button>
        <button type="button" class="relative inline-flex items-center border px-4 py-2 text-sm font-medium border-gray-300 bg-white text-gray-700 hover:bg-gray-50 dark:border-dark-600 dark:bg-dark-700 dark:text-gray-300 dark:hover:bg-dark-600">10</button>
        <button type="button" class="relative inline-flex items-center rounded-r-md border border-gray-300 bg-white px-2 py-2 text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50 dark:border-dark-600 dark:bg-dark-700 dark:text-gray-400 dark:hover:bg-dark-600" aria-label="下一页"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg></button>
      </nav>
    </div>
  </div>
</div>
</body>
</html>
