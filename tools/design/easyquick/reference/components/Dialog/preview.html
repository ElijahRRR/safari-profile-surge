<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Dialog</title></head>
<body class="p-8">
<div class="space-y-4" aria-hidden="true">
  <div class="h-8 w-48 rounded-lg bg-gray-200 dark:bg-dark-700"></div>
  <div class="grid grid-cols-3 gap-4"><div class="card h-24"></div><div class="card h-24"></div><div class="card h-24"></div></div>
  <div class="card h-48"></div>
</div>
<div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
  <div class="modal-content max-w-lg">
    <div class="modal-header">
      <h3 id="dlg-title" class="modal-title">编辑商品</h3>
      <button type="button" class="-mr-2 rounded-xl p-2 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500/30 focus-visible:ring-offset-2 dark:text-dark-500 dark:hover:bg-dark-700 dark:hover:text-dark-300 dark:focus-visible:ring-offset-dark-900" aria-label="关闭"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body space-y-4">
      <div>
        <label class="input-label">商品标题</label>
        <input class="input" value="不锈钢保温杯 500ml">
      </div>
      <div>
        <label class="input-label">售价（USD）</label>
        <input class="input" value="24.99">
        <p class="input-hint mt-1.5">保存后约 15 分钟同步到 Walmart</p>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary">取消</button>
      <button type="button" class="btn btn-primary">保存</button>
    </div>
  </div>
</div>
</body>
</html>
