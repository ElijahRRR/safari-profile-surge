<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Loading</title></head>
<body class="p-6">
<div class="grid grid-cols-2 gap-6">
  <div class="card card-body space-y-5">
    <div class="flex items-end gap-6">
      <div class="spinner w-4 h-4 border-2 text-primary-500" role="status" aria-label="加载中"></div>
      <div class="spinner w-8 h-8 border-2 text-primary-500" role="status" aria-label="加载中"></div>
      <div class="spinner w-12 h-12 border-[3px] text-primary-500" role="status" aria-label="加载中"></div>
      <div class="spinner w-16 h-16 border-4 text-gray-400 dark:text-dark-500" role="status" aria-label="加载中"></div>
    </div>
    <button type="button" class="btn btn-primary" disabled><span class="spinner w-4 h-4 border-2 text-white"></span>保存中…</button>
  </div>
  <div class="card card-body space-y-3" aria-hidden="true">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 animate-pulse bg-gray-200 dark:bg-dark-700 rounded-full"></div>
      <div class="flex-1 space-y-2">
        <div class="h-4 w-1/2 animate-pulse bg-gray-200 dark:bg-dark-700 rounded-lg"></div>
        <div class="h-3 w-1/3 animate-pulse bg-gray-200 dark:bg-dark-700 rounded-lg"></div>
      </div>
    </div>
    <div class="h-4 w-full animate-pulse bg-gray-200 dark:bg-dark-700 rounded-lg"></div>
    <div class="h-4 w-5/6 animate-pulse bg-gray-200 dark:bg-dark-700 rounded-lg"></div>
    <div class="h-8 w-full animate-pulse bg-gray-200 dark:bg-dark-700 rounded-lg"></div>
  </div>
</div>
</body>
</html>
